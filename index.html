<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房報爆管理 Demo</title><style>body{margin:0;background:#edf2f6;color:#18354d;font:16px system-ui}header{background:#142b40;color:white;padding:24px}main{max-width:960px;margin:auto;padding:20px}button,select{font:inherit;padding:12px;margin:4px;border:1px solid #bac9d6;border-radius:8px;background:white;color:#18354d}section{background:white;border-radius:12px;padding:20px;margin-top:12px}textarea{box-sizing:border-box;width:100%;min-height:120px;font:inherit}article{background:#eef2f6;padding:16px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}</style><header>PROJECT CONTROL CENTER · DEMO V1.0<h1>fun bon bon 房報爆</h1>公開示範資料｜非即時進度</header><main><nav id="nav"></nav><section id="view"></section></main><script>const pages=['專案總覽','V1.4 規格','測試結果','問題追蹤','版本紀錄','審核管理'];const specs=['物件資料與素材','模板／Presenter','資料檢查','Prompt Compiler','Prompt Lock','Omni 生成','Validation','管理者審核','核准後發布'];const issues=[['P0','後端連線驗證'],['P0','空間結構保真'],['P1','三機同步測試'],['P1','影片秒數驗證']];const view=document.getElementById('view');function show(i){view.innerHTML='<h2>'+pages[i]+'</h2>';if(i===0)view.innerHTML+='<p>V1.4｜六階段｜完成率未驗證</p><div class="grid">'+Array.from({length:6},(_,n)=>'<article>階段 '+(n+1)+'<p>待驗證</p></article>').join('')+'</div>';if(i===1)view.innerHTML+=specs.map((s,n)=>'<p>'+(n+1)+'. '+s+' — 尚未驗證</p>').join('')+'<p>照片最多10張，每張2MB；影片20–45秒。</p>';if(i===2)view.innerHTML+='<p>影片保真、上傳限制、三機同步、發布權限：尚未執行本版實測。</p>';if(i===3){view.innerHTML+='<select id="filter"><option>全部</option><option>P0</option><option>P1</option></select><div id="issues"></div>';const f=document.getElementById('filter');const render=()=>document.getElementById('issues').innerHTML=issues.filter(x=>f.value==='全部'||x[0]===f.value).map(x=>'<p>'+x.join(' ｜ ')+'（示範待辦）</p>').join('');f.onchange=render;render()}if(i===4)view.innerHTML+='<p>V1.4：架構基準</p><p>Demo V1.0：獨立公開示範介面</p>';if(i===5){view.innerHTML+='<p>本機審核筆記，不代表正式核准。</p><textarea id="note"></textarea><p><button id="save">儲存筆記</button><button id="export">匯出報告</button></p><p id="status"></p>';const n=document.getElementById('note');n.value=localStorage.getItem('bon-demo-note')||'';document.getElementById('save').onclick=()=>{localStorage.setItem('bon-demo-note',n.value);document.getElementById('status').textContent='已儲存於本機'};document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['房報爆 Demo 審核筆記\n'+n.value],{type:'text/plain;charset=utf-8'}));a.download='bon-demo-review.txt';a.click();URL.revokeObjectURL(a.href)}}}pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>show(i);document.getElementById('nav').append(b)});show(0)</script></html>
